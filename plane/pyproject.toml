[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plane"
version = "0.1.0"
description = "PLANE: profile-guided link allocation for networked experts"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plane = "moe_feeder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_feeder*"]
